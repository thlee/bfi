[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfi"
version = "1.0.2"
description = "Breeding Freedom Index — genomic design space metric for crop breeding"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Minwoo Kim"},
    {name = "Keunpyo Lee"},
    {name = "Kyung Do Kim"},
    {name = "Ji-Hun Hwang"},
    {name = "Tae-Ho Lee", email = "thlee0@korea.kr"},
]
keywords = ["breeding", "genomics", "linkage-disequilibrium", "crop-breeding", "BFI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
]

[project.scripts]
bfi = "bfi.cli:main"

[project.urls]
Homepage = "https://github.com/thlee/bfi"
Documentation = "https://github.com/thlee/bfi#readme"
Repository = "https://github.com/thlee/bfi"
